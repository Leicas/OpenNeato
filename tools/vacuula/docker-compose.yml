# Vacuula server — LAN replacement for Neato's cloud (https://github.com/vacuula/vacuula).
#
# Botvac D3-D7 firmware is hard-wired to reach its cloud on port 443, so the
# server must own that port on the host. Run on a Linux box with a fixed LAN IP:
#
#   docker compose up -d
#   open http://<host>/          (web app)
#   curl http://<host>/api/cert  (certificate the provision script bundles)
#
# Docker Desktop (Windows/macOS) has no host networking: replace `network_mode`
# with the `ports:` block below, set MDNS_ENABLED=False and always pass the
# host's LAN IP to provision.py with --server.
#
# Home Assistant OS users can install the same image as the Vacuula add-on
# instead (repository https://github.com/vacuula/vacuula).

services:
  vacuula:
    image: ghcr.io/vacuula/vacuula:latest
    container_name: vacuula
    network_mode: host
    # ports:
    #   - "80:80"
    #   - "443:443"
    #   - "3443:3443"
    # Vacuula builds the map-upload URL it hands to the robot from the address of
    # host.docker.internal, falling back to the host's outbound IP. On a host with
    # several interfaces (or when a LAN DNS catch-all swallows nip.io names) that
    # fallback can be an address the robot cannot reach, and persistent-map uploads
    # then retry forever. Pin it to the IP the robot connects to:
    # extra_hosts:
    #   - "host.docker.internal:192.168.1.10"
    environment:
      - GEN4_PORT=3443
      - VACUULA_PORT=80
      - GEN3_ENABLED=True
      - GEN4_ENABLED=False
      - MDNS_ENABLED=True
    volumes:
      - vacuula-data:/server/data
    restart: unless-stopped

volumes:
  vacuula-data:
